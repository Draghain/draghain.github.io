<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draghain</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #5c5c5c; --link: #1a53b0; --card: #f6f7f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171a; --fg: #e8e8e8; --muted: #a2a8b0; --link: #7fb0ff; --card: #1d2025; }
  }
  body { margin: 0; padding: 2.5rem 1.25rem; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { margin: 0 0 1.5rem; }
  .app { background: var(--card); border-radius: 12px; padding: 1rem 1.25rem; }
  .app h2 { margin: 0 0 .25rem; font-size: 1.15rem; }
  .app p { margin: 0 0 .5rem; color: var(--muted); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>Draghain</h1>
  <section class="app">
    <h2>MovieCollector</h2>
    <p>Catalogue your DVD and Blu-ray collection by scanning barcodes.</p>
    <a href="https://play.google.com/store/apps/details?id=com.draghain.moviedb">Google Play</a> ·
    <a href="https://draghain.github.io/moviecollector-privacy/">Privacy policy</a>
  </section>
</main>
</body>
</html>
